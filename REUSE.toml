version = 1

# Licences are set here rather than in file headers: the records hold the SHA-256 of the scripts
# and conditions they ran, so those files are not edited. When several annotations match a file,
# the last one applies.

# (b) Our documents, conditions and texts, the results and images of runs v1 to v5 (synthetic
# keystrokes only), the SHA-256 digests of the records of runs v6k to v6s (hashes only, no values),
# and the files of series/ that list units, statuses and file hashes: CC BY 4.0.
[[annotations]]
path = [
  "README.md",
  "README.ja.md",
  "CITATION.cff",
  "commit-map.tsv",
  "docs/**",
  "works/texts/**",
  "works/conditions/**",
  "capture/chain/SHA256SUMS.txt",
  "results/prototype_v1/**",
  "results/prototype_v2/**",
  "results/prototype_v3/**",
  "results/prototype_v4/**",
  "results/prototype_v5/**",
  "results/record-digests.json",
  "series/*/status.csv",
  "series/*/manifest.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mikoto Miura and Yuusuke Harada"
SPDX-License-Identifier = "CC-BY-4.0"

# (a) Code and the files of the environment: MIT.
[[annotations]]
path = [
  "src/**",
  "works/*.py",
  "capture/*.py",
  "capture/**/*.py",
  "capture/**/*.ps1",
  "capture/page/**",
  "capture/.gitignore",
  "tools/**",
  "tests/**",
  "pyproject.toml",
  "uv.lock",
  ".python-version",
  ".gitignore",
  "**/.gitkeep",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mikoto Miura and Yuusuke Harada"
SPDX-License-Identifier = "MIT"

# (c) Results that count keystroke data of others (runs v6 to v6j and v7 to v7v): the terms of the
# source data (LICENSES/LicenseRef-source-data-terms.txt).
[[annotations]]
path = [
  "results/prototype_v6*/**",
  "results/prototype_v7*/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mikoto Miura and Yuusuke Harada"
SPDX-License-Identifier = "LicenseRef-source-data-terms"

# (d) Released series. Kinds and times of the key presses planned and recorded by runs v7 and v7s,
# without keys, text or person identifiers. Series made from KUPA-KEYS (Velentzas et al.,
# LREC-COLING 2024): CC BY-NC-SA 4.0. The other series: CC BY 4.0.
[[annotations]]
path = ["series/*/not-kupa-derived/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mikoto Miura and Yuusuke Harada"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["series/*/kupa-derived/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mikoto Miura and Yuusuke Harada"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"
